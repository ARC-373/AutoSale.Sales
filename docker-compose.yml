name: autosale-sales

services:
  sales-api:
    build:
      context: .
      dockerfile: src/AutoSale.Sales.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Sales: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      Authentication__Authority: ${AUTHORITY}
      Authentication__ClientId: ${CLIENT_ID}
      Authentication__AuthorizationEndpoint: ${AUTHORIZATION_ENDPOINT}
      Authentication__TokenEndpoint: ${TOKEN_ENDPOINT}
      IntegrationAuthentication__VehiclesToSalesServiceKey: ${VEHICLES_TO_SALES_SERVICE_KEY}
      IntegrationAuthentication__PaymentWebhookKey: ${PAYMENT_WEBHOOK_KEY}
      Integrations__Vehicles__BaseUrl: ${VEHICLES_BASE_URL}
      Integrations__Vehicles__SalesToVehiclesServiceKey: ${SALES_TO_VEHICLES_SERVICE_KEY}
      Integrations__Payments__BaseUrl: http://payments-mock:8080
      Integrations__Payments__ServiceKey: ${PAYMENTS_SERVICE_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: autosale-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=${APP_VERSION}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - default
      - autosale-integration

  payments-mock:
    build:
      context: .
      dockerfile: src/AutoSale.Payments.Mock/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Payments: Data Source=/data/payments.db
      Database__ApplyMigrationsOnStartup: "true"
      Authentication__SalesServiceKey: ${PAYMENTS_SERVICE_KEY}
      Authentication__OperatorKey: ${PAYMENTS_OPERATOR_KEY}
      Integrations__Sales__BaseUrl: http://sales-api:8080
      Integrations__Sales__WebhookKey: ${PAYMENT_WEBHOOK_KEY}
      Integrations__Sales__TimeoutSeconds: 5
    ports:
      - "${PAYMENTS_PORT}:8080"
    volumes:
      - payments-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
  #     PGADMIN_CONFIG_SERVER_MODE: "False"
  #   ports:
  #     - "${PGADMIN_PORT}:80"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin

  otel-collector:
    image: otel/opentelemetry-collector:0.101.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"

volumes:
  postgres-data:
  pgadmin-data:
  payments-data:

networks:
  autosale-integration:
    name: autosale-integration
    driver: bridge