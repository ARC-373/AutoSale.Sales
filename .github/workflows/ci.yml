name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AutoSale.Sales.slnx

      - name: Build
        run: dotnet build AutoSale.Sales.slnx --configuration $CONFIGURATION --no-restore

      - name: Test
        run: >
          dotnet test AutoSale.Sales.slnx --configuration $CONFIGURATION --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build API image
        run: docker compose build sales-api

  compose-deploy-validation:
    name: Validate Docker Compose deployment
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=autosale
          POSTGRES_USER=autosale
          POSTGRES_PASSWORD=autosale-ci-password
          POSTGRES_PORT=15433
          API_PORT=18081
          PGADMIN_EMAIL=admin@example.test
          PGADMIN_PASSWORD=pgadmin-ci-password
          PGADMIN_PORT=15050
          OTEL_GRPC_PORT=14327
          OTEL_HTTP_PORT=14328
          APP_VERSION=ci
          VEHICLES_BASE_URL=http://vehicles-api:18080
          SALES_TO_VEHICLES_SERVICE_KEY=ci-sales-to-vehicles-key
          VEHICLES_TO_SALES_SERVICE_KEY=ci-vehicles-to-sales-key
          PAYMENTS_SERVICE_KEY=ci-payments-service-key
          PAYMENT_WEBHOOK_KEY=ci-payment-webhook-key
          PAYMENTS_OPERATOR_KEY=ci-operator-key
          AUTHORITY=https://example.invalid
          CLIENT_ID=autosale-ci
          AUTHORIZATION_ENDPOINT=https://example.invalid/oauth2/authorize
          TOKEN_ENDPOINT=https://example.invalid/oauth2/token
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start API stack
        run: docker compose up --detach --build sales-api

      - name: Wait for API health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:18081/health; then
              exit 0
            fi

            sleep 2
          done

          echo "API did not become healthy within 60 seconds."
          exit 1

      - name: Show Compose diagnostics
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Stop API stack
        if: always()
        run: docker compose down --volumes --remove-orphans
